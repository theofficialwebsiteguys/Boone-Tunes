<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BooneTunes</title>
  <script>
    /**
     * GitHub Pages SPA redirect — single-page app routing fix.
     *
     * GitHub Pages serves this 404.html when a path like /dashboard or /player
     * isn't found as a static file. This script encodes the URL as a query
     * string and redirects to index.html, which restores it via history.replaceState.
     *
     * Based on https://github.com/rafgraph/spa-github-pages
     *
     * pathSegmentsToKeep:
     *   1 = project page  (https://user.github.io/REPO-NAME/)
     *   0 = user/org page (https://user.github.io/)
     */
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
