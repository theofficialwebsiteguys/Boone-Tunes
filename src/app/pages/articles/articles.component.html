<div class="page">
  <div class="content">

    <button class="btn-back" (click)="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Dashboard
    </button>

    <div class="page-title-row">
      <span class="page-title-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="26" height="26">
          <path d="M4 4h13a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4Z"/>
          <path d="M4 19a3 3 0 0 1 3-3h13"/>
          <path d="M9 8h7"/>
          <path d="M9 12h7"/>
        </svg>
      </span>
      <div>
        <h1>Read Articles</h1>
        <p class="page-subtitle">Stay informed with the latest music news and trends</p>
      </div>
    </div>

    <div class="article-grid">
      @for (article of articles; track article.id) {
        <div class="article-card" (click)="openArticle(article.id)">
          <div class="article-art">
            <img [src]="article.imageUrl" [alt]="article.title" loading="lazy" />
            <span class="article-tag">{{ article.tag }}</span>
          </div>
          <div class="article-body">
            <span class="article-date">{{ article.date | date:'MMM d, y' }}</span>
            <h3 class="article-title">{{ article.title }}</h3>
            <p class="article-excerpt">{{ article.excerpt }}</p>
            <span class="article-readtime">{{ article.readTime }}</span>
          </div>
        </div>
      }
    </div>

  </div>
</div>
