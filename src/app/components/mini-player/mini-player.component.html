@if (show) {
  <div class="mini-player" (click)="openPlayer()">

    <!-- Thin progress bar — fills from left as song plays -->
    <div class="mini-progress">
      <div class="mini-progress-fill" [style.width.%]="progress"></div>
    </div>

    <div class="mini-content">

      <!-- Art / live video thumbnail -->
      <div class="mini-video-wrap">
        @if (hasVideo) {
          <div #videoSlot class="mini-video-slot"></div>
        } @else if (currentItem!.track.albumArtUrl) {
          <img class="mini-fallback-art" [src]="currentItem!.track.albumArtUrl" [alt]="currentItem!.track.name" />
        } @else {
          <div class="mini-fallback-art mini-fallback-placeholder">♪</div>
        }
        <!-- Overlay so clicks pass through to openPlayer() handler -->
        <div class="mini-video-overlay"></div>
      </div>

      <!-- Track info -->
      <div class="mini-info">
        <span class="mini-name">{{ currentItem!.track.name }}</span>
        <span class="mini-artist">{{ currentItem!.track.artists.join(', ') }}</span>
      </div>

      <!-- Controls (stop click propagation so buttons don't also fire openPlayer) -->
      <div class="mini-controls">

        <button class="mini-play" (click)="togglePlay($event)" [title]="isPlaying ? 'Pause' : 'Play'">
          @if (isPlaying) {
            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
              <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
          }
        </button>

        <button class="mini-next" (click)="next($event)" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
            <polygon points="5 4 15 12 5 20 5 4"/>
            <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>

        <button class="mini-queue" (click)="openPlayer(); $event.stopPropagation()" title="Open queue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
          Queue ({{ queueLength }})
        </button>

      </div>
    </div>
  </div>
}
